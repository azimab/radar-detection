# Proposed radar-aware augmentation block for rear_radar_dataset.yaml.
# Consumed by radar/radar_augment.py:augment_radar_sample, called from
# RadarDataset.__getitem__ BEFORE prepare_data, training split only. Keep the generic
# DATA_AUGMENTOR disabled (its flips/rotations do not transform the Doppler features).
# Any key left out falls back to radar_augment.DEFAULT_CONFIG (same values as below).
RADAR_AUGMENT:
    ENABLED: True
    # rear_axle_middle <- radar_rear, AV-24 URDF (data_nuscenes calibrated_sensor.json).
    # Must match the build: builder_los_xy() reproduces the builder's line of sight.
    MOUNT_XYZ: [-0.498, 0.0, 0.233]
    MOUNT_RPY_DEG: [0.0, -5.0, 180.0]

    # Reflection about the vertical plane through the radar (y = MOUNT_XYZ[1] = 0). Exact.
    MIRROR:
        PROB: 0.5

    # Yaw about the vertical axis through the radar, uniform in [-MAX_DEG, MAX_DEG].
    # REPROJECT_V_REL: fit the radar's velocity per scan (per time_lag if stacked) and
    # re-project v_rel onto the new line of sight; otherwise v_rel is off by up to
    # |v_ego| * 2 sin(a/2) = 2.2 m/s at 5 deg and 25 m/s (an implied ego sideslip of a).
    ROTATION:
        PROB: 1.0
        MAX_DEG: 5.0
        REPROJECT_V_REL: True
        FIT_TOLERANCE_MPS: 0.1

    # Per GT box, with PROB: drop FRACTION~U[lo, hi] of its in-box (BEV) points, always
    # keeping MIN_KEEP points of which MIN_MOVING_KEEP have |v_abs| >= MOVING_SPEED_MPS
    # (the dataset's positive rule: min_points_in_box 2, min_moving_points_in_box 1).
    BOX_DROPOUT:
        PROB: 0.3
        FRACTION: [0.2, 0.8]
        MIN_KEEP: 2
        MIN_MOVING_KEEP: 1
        MOVING_SPEED_MPS: 2.0

    # One offset ~U[-MAX_DB, MAX_DB] per scan added to rcs and power (both dB, same
    # calibration: power - rcs + 40 log10(range) ~ 136 dB on every run). snr is left
    # alone by default (floored at the 12 dB detection threshold); confidence always.
    INTENSITY_OFFSET:
        PROB: 1.0
        MAX_DB: 10.0
        SHIFT_SNR: False
