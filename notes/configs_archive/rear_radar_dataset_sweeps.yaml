DATASET: 'RadarDataset'
# Multi-scan variant of rear_radar_dataset.yaml (full copy: _BASE_CONFIG_ paths resolve
# against the working directory). Differences: NUM_SWEEPS, time_lag and
# NUM_POINT_FEATURES. Voxel limits are unchanged: 4 stacked scans peak at 2224 (train)
# and 2680 (val) occupied pillars in range, under the 4000/8000 caps, and <1e-5 of
# points exceed MAX_POINTS_PER_VOXEL.
# nuScenes v1.0 dataroot written by radar_openpcdet/build_nuscenes_dataset.py.
# DATA_SPLIT values are splits.json keys; RadarDataset reads the tables directly.
DATA_PATH: '${RADAR_DATA_ROOT}/data_nuscenes'
NUM_POINT_FEATURES: 12

POINT_CLOUD_RANGE: [-102.4, -51.2, -16.0, 0.0, 51.2, 16.0]

# train on Laguna Seca, validate on Caltech at Putnam Park. Run-blocked: no lap,
# recording or track segment is shared between the two. `test` (IU, Putnam Park,
# a different day) is held out entirely and is selected by the *_test.yaml config.
DATA_SPLIT: {
    'train': train,
    'test': val
}


# Background frames carry a genuine "no car in the rear sector" label and are 20% of
# every split by construction, so they must survive to the model rather than being
# resampled away.
ALLOW_EMPTY_GT: True

EVAL_IOU_THRESHOLDS: [0.3, 0.5, 0.7]
EVAL_SCORE_THRESHOLD: 0.3
EVAL_RANGE_BINS: [[0, 20], [20, 40], [40, 60], [60, 105]]

# Current scan + 3 previous (~0.19 s at 16 Hz), each kept in its own recorded ego frame:
# the opponent follows at nearly our speed, so it stays aligned while static clutter
# smears and is separated by Doppler. A scan older than MAX_SWEEP_LAG_S (a recording
# gap) or from another scene is never stacked; the chain is just shorter.
NUM_SWEEPS: 4
MAX_SWEEP_LAG_S: 0.5
SWEEP_EGO_COMPENSATION: False

# Generic OpenPCDet flips/rotations do not rotate the decomposed Doppler vector
# (v_abs_x, v_abs_y) or re-project the radial v_rel. Keep augmentation off until
# radar-aware transforms exist.
DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST: []

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: [
        'x', 'y', 'z', 'v_rel', 'v_abs', 'v_abs_x', 'v_abs_y',
        'rcs', 'snr', 'confidence', 'power', 'time_lag'
    ],
    src_feature_list: [
        'x', 'y', 'z', 'v_rel', 'v_abs', 'v_abs_x', 'v_abs_y',
        'rcs', 'snr', 'confidence', 'power', 'time_lag'
    ],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    # One 32 m pillar: FRGen21 elevation is too noisy to voxelise, but measured z
    # is kept as an input feature. 256 x 256 BEV cells over the rear ROI.
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.4, 0.4, 32.0]
      MAX_POINTS_PER_VOXEL: 32
      MAX_NUMBER_OF_VOXELS: {
        'train': 4000,
        'test': 8000
      }
