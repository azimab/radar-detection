# v3 training data: rear_radar_dataset_sweeps.yaml (4 stacked scans + time_lag) plus the
# Doppler-consistent RADAR_AUGMENT block (radar/radar_augment.py). Full copy for the same
# _BASE_CONFIG_ reason. Augmentation applies to the training split only.
DATASET: 'RadarDataset'
# Multi-scan variant of rear_radar_dataset.yaml (full copy: _BASE_CONFIG_ paths resolve
# against the working directory). Differences: NUM_SWEEPS, time_lag and
# NUM_POINT_FEATURES. Voxel limits are unchanged: 4 stacked scans peak at 2224 (train)
# and 2680 (val) occupied pillars in range, under the 4000/8000 caps, and <1e-5 of
# points exceed MAX_POINTS_PER_VOXEL.
# nuScenes v1.0 dataroot written by radar_openpcdet/build_nuscenes_dataset.py.
# DATA_SPLIT values are splits.json keys; RadarDataset reads the tables directly.
DATA_PATH: '${RADAR_DATA_ROOT}/data_nuscenes'
NUM_POINT_FEATURES: 12

POINT_CLOUD_RANGE: [-102.4, -51.2, -16.0, 0.0, 51.2, 16.0]

# train on Laguna Seca, validate on Caltech at Putnam Park. Run-blocked: no lap,
# recording or track segment is shared between the two. `test` (IU, Putnam Park,
# a different day) is held out entirely and is selected by the *_test.yaml config.
DATA_SPLIT: {
    'train': train,
    'test': val
}


# Background frames carry a genuine "no car in the rear sector" label and are 20% of
# every split by construction, so they must survive to the model rather than being
# resampled away.
ALLOW_EMPTY_GT: True

EVAL_IOU_THRESHOLDS: [0.3, 0.5, 0.7]
EVAL_SCORE_THRESHOLD: 0.3
EVAL_RANGE_BINS: [[0, 20], [20, 40], [40, 60], [60, 105]]

# Current scan + 3 previous (~0.19 s at 16 Hz), each kept in its own recorded ego frame:
# the opponent follows at nearly our speed, so it stays aligned while static clutter
# smears and is separated by Doppler. A scan older than MAX_SWEEP_LAG_S (a recording
# gap) or from another scene is never stacked; the chain is just shorter.
NUM_SWEEPS: 4
MAX_SWEEP_LAG_S: 0.5
SWEEP_EGO_COMPENSATION: False

# Generic OpenPCDet flips/rotations do not transform the Doppler features, so the stock
# augmentor stays off; RADAR_AUGMENT below does it Doppler-consistently.
DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST: []

# Radar-aware replacement: see radar_augment_example.yaml for the rationale of each value.
RADAR_AUGMENT:
    ENABLED: True
    # rear_axle_middle <- radar_rear, AV-24 URDF (data_nuscenes calibrated_sensor.json).
    # Must match the build: builder_los_xy() reproduces the builder's line of sight.
    MOUNT_XYZ: [-0.498, 0.0, 0.233]
    MOUNT_RPY_DEG: [0.0, -5.0, 180.0]

    # Reflection about the vertical plane through the radar (y = MOUNT_XYZ[1] = 0). Exact.
    MIRROR:
        PROB: 0.5

    # Yaw about the vertical axis through the radar, uniform in [-MAX_DEG, MAX_DEG].
    # REPROJECT_V_REL: fit the radar's velocity per scan (per time_lag if stacked) and
    # re-project v_rel onto the new line of sight; otherwise v_rel is off by up to
    # |v_ego| * 2 sin(a/2) = 2.2 m/s at 5 deg and 25 m/s (an implied ego sideslip of a).
    ROTATION:
        PROB: 1.0
        MAX_DEG: 5.0
        REPROJECT_V_REL: True
        FIT_TOLERANCE_MPS: 0.1

    # Per GT box, with PROB: drop FRACTION~U[lo, hi] of its in-box (BEV) points, always
    # keeping MIN_KEEP points of which MIN_MOVING_KEEP have |v_abs| >= MOVING_SPEED_MPS
    # (the dataset's positive rule: min_points_in_box 2, min_moving_points_in_box 1).
    BOX_DROPOUT:
        PROB: 0.3
        FRACTION: [0.2, 0.8]
        MIN_KEEP: 2
        MIN_MOVING_KEEP: 1
        MOVING_SPEED_MPS: 2.0

    # One offset ~U[-MAX_DB, MAX_DB] per scan added to rcs and power (both dB, same
    # calibration: power - rcs + 40 log10(range) ~ 136 dB on every run). snr is left
    # alone by default (floored at the 12 dB detection threshold); confidence always.
    INTENSITY_OFFSET:
        PROB: 1.0
        MAX_DB: 10.0
        SHIFT_SNR: False

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: [
        'x', 'y', 'z', 'v_rel', 'v_abs', 'v_abs_x', 'v_abs_y',
        'rcs', 'snr', 'confidence', 'power', 'time_lag'
    ],
    src_feature_list: [
        'x', 'y', 'z', 'v_rel', 'v_abs', 'v_abs_x', 'v_abs_y',
        'rcs', 'snr', 'confidence', 'power', 'time_lag'
    ],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    # One 32 m pillar: FRGen21 elevation is too noisy to voxelise, but measured z
    # is kept as an input feature. 256 x 256 BEV cells over the rear ROI.
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.4, 0.4, 32.0]
      MAX_POINTS_PER_VOXEL: 32
      MAX_NUMBER_OF_VOXELS: {
        'train': 4000,
        'test': 8000
      }
