# Putnam Park 2026-04-15, IU opponent. Test split (held out).
# Why each value is what it is: notes/calibration_history.md#iu_2026_04_15_rear
# Known issue: unexplained range-proportional lateral bias (~ -1.3 deg of bearing) and a
# box offset 0.33 m outside the URDF window. Left as measured; see notes/RESULTS.md.
name: iu_2026_04_15_rear
location: putnam-park   # nuScenes log.location
split: test
multitrack_run: iu_2026_04_15

radar_mcap: ${AV24_DATA}/processed/nuscenes/iu_data/5min_uvadata_iu.mcap
radar_topic: /frgen21/pointcloud
ego_odom_mcap: ${AV24_DATA}/processed/nuscenes/iu_data/5min_uvadata_iu.mcap
# Relabelled radar frame, identity rotation, no pitch: the mounting comes from the URDF.
tf_mcap: ${AV24_DATA}/processed/nuscenes/iu_data/5min_uvadata_iu.mcap
target_frame: rear_axle_middle
sensor_frame_aliases: [frgen21, radar_rear_zf, radar_rear]

# --- calibration -------------------------------------------------------------------
# Header is a time-since-boot clock, so log time.
time_source: log
# Deliberately 0: a fine sweep-clock did not confirm the coarse +0.12 s suggestion.
radar_time_offset_seconds: 0.0
box_center_forward_offset_m: -1.34    # near_edge gate fit
opponent_time_offset_seconds: 0.0
# /opponent/gps: the opponent's Novatel antenna pair. Used only by the URDF window check.
opponent_pose_origin: novatel_midpoint
