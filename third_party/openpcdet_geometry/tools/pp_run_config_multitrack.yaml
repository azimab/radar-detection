          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: +0.002   # polimove, 3.8 m/s: unmeasurable. Inherits the polimove car mean of s1/s2.

    - name: lvms_2025_01_07_run3_fourcar
      # NOT the densest multi-car data, despite the name -- measured, only 1.0% of this
      # run has two opponents within 120 m, and the 2026-07-31 build produced ZERO
      # two-car frames from it. Three of its four GT sources are time-disjoint POLIMOVE
      # sessions of the same car, so it is effectively two cars, and KAIST is far away
      # whenever POLIMOVE is close. lvms_2025_01_06_run2 is the real multi-car run
      # (36.1% of it has two opponents in range, 1380 two-car frames). Still worth
      # keeping: it contributed 6,853 single-car labels.
      ego_odom:
        - ${AV24_DATA}/raw/LVMS/2025_01_07/run3_fourcar/rosbag2_2025_01_07-22_58_20_no_lidar/no_lidar.mcap
      fused_lidar:
        # Only the full 3308 s recording. The run dir also holds
        # lvms-2025-01-07-tracing-full.mcap (85 s) and lidar_tracker_testing.mcap (95 s),
        # which are excerpts whose spans lie INSIDE this bag -- including them would
        # duplicate frames and pair front sweeps with unrelated flank sweeps.
        - ${AV24_DATA}/raw/LVMS/2025_01_07/run3_fourcar/rosbag2_2025_01_07-22_58_20_lidar/lidar.mcap
      fuse_raw: true
      tf_static:
        - ${AV24_DATA}/raw/LVMS/2025_01_07/run3_fourcar/rosbag2_2025_01_07-22_58_20_no_lidar/no_lidar.mcap
      opponents:
        - name: kaist
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/KAIST/localized/2025_01_07_23_00_58/2025_01_07_23_00_58_0.mcap
          odom_topic: /kaist/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: -0.021   # kaist: 530-698 m away all run, never measurable. Inherits the kaist value from lvms_01_08.
        # Three time-disjoint POLIMOVE sessions covering one car across the run. Each is
        # its own timeline and contributes a box only inside its own span.
        - name: polimove_s1
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/POLIMOVE/localized/2025_01_07_22_56_22/2025_01_07_22_56_22_0.mcap
          odom_topic: /polimove/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: +0.009   # polimove_s1 @35.6 m/s: points peak +0.005 (plateau -0.010..+0.010), hand +0.014. AGREE.
        - name: polimove_s2
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/POLIMOVE/localized/2025_01_07_23_18_33/2025_01_07_23_18_33_0.mcap
          odom_topic: /polimove/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: -0.005   # polimove_s2 @45.1 m/s: points peak -0.010 (plateau -0.025..+0.000), hand +0.001. AGREE.
        - name: polimove_s3
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/POLIMOVE/localized/2025_01_07_23_40_18/2025_01_07_23_40_18_0.mcap
          odom_topic: /polimove/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: +0.002   # polimove_s3, 5.4 m/s: unmeasurable. Inherits the polimove car mean of s1/s2.

    - name: lvms_2025_01_08_run1
      ego_odom:
        - ${AV24_DATA}/raw/LVMS/2025_01_08/run1/rosbag2_2025_01_08-19_19_18_no_lidar/no_lidar.mcap
      fused_lidar:
        - ${AV24_DATA}/raw/LVMS/2025_01_08/run1/rosbag2_2025_01_08-19_19_18_lidar/lidar.mcap
      fuse_raw: true
      tf_static:
        - ${AV24_DATA}/raw/LVMS/2025_01_08/run1/rosbag2_2025_01_08-19_19_18_no_lidar/no_lidar.mcap
      opponents:
        - name: unimore
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/UNIMORE/localized/2025_01_08_19_07_37/2025_01_08_19_07_37_0.mcap
          odom_topic: /unimore/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: -0.027   # unimore, 0.1 m/s parked: unmeasurable. Inherits the unimore car mean.
        - name: kaist
          odom:
            - ${AV24_DATA}/processed/opponent_gps_data/2025_LVMS_Labels/KAIST/localized/2025_01_08_19_14_10/2025_01_08_19_14_10_0.mcap
          odom_topic: /kaist/vehicle/uva_odometry
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: -0.021   # kaist @38.7 m/s: points peak -0.035 (plateau -0.040..-0.010), hand -0.007. AGREE.

    # --- Laguna Seca -------------------------------------------------------------
    - name: laguna_2026_07_26_run3
      # UNBLOCKED 2026-07-31. The datum mismatch is corrected by map_offset_xyz below,
      # measured with pp_align_datum.py. Validated against real lidar points at the true
      # closest pass (t~1785107565): 100% of frames labelled, median 538 points in box,
      # box floor within -0.087 m of the points. It was 2% and 0 points before.
      # Not in session_manifest.json: the audit tool does not enumerate Laguna yet, so
      # every path here was verified by hand. The GT bag lives OUTSIDE the run dir.
      # PATHS UPDATED 2026-08-14. ark8su reorganised this run dir on 2026-08-13: every bag
      # moved down one level into run3/rosbags/, and the nine lidar_0..8.mcap splits were
      # consolidated into a single lidar.mcap. The old paths raised FileNotFoundError.
      #
      # Verified before repointing, because a truncated consolidation would silently cost
      # 7,336 labels rather than failing: lidar.mcap spans 1204.6 s against no_lidar's
      # 1204.9 s and the cached ego odometry's 1204.4 s, and it still carries all three
      # /pcl_front|left|right topics (18,069 / 18,068 / 18,061 messages) that fuse_raw
      # needs. tf_static is present in no_lidar_0.mcap.
      ego_odom:
        - ${AV24_DATA}/raw/LagunaSeca/Cavalier/2026_07_26/run3/rosbags/no_lidar/no_lidar_0.mcap
      fused_lidar:
        - ${AV24_DATA}/raw/LagunaSeca/Cavalier/2026_07_26/run3/rosbags/lidar/lidar.mcap
      fuse_raw: true
      tf_static:
        - ${AV24_DATA}/raw/LagunaSeca/Cavalier/2026_07_26/run3/rosbags/no_lidar/no_lidar_0.mcap
      opponents:
        - name: purdue
          odom:
            - ${AV24_DATA}/raw/LagunaSeca/purdue_pos_and_vel_odom_jul26_4pm/purdue_pos_and_vel_odom_jul26_4pm_0.mcap
          odom_topic: /odometry/global_filtered
          # SET TO THE MEASURED SYSTEMATIC -0.035 s (2026-09-27, pp_clock_sweep.py).
          # Not a per-opponent fit: see the header note above `runs:`.
          time_offset_seconds: -0.021   # purdue, 9.8 m/s: curve flat, unmeasurable. Inherits the median.
          # Purdue logs absolute altitude; our odometry is in the exwayz local map frame.
          # 201.27 m is the measured vertical difference.
          z_offset: 201.27
          # The horizontal half of the same datum mismatch, which is why every Laguna box
          # used to miss the car. Measured by pp_align_datum.py, which fits each car's
          # odometry against that car's OWN GNSS and composes the two -- so neither fit
          # depends on the other team's conventions, and there is none of the
          # translation-vs-clock degeneracy that made points-in-box sweeps useless here.
          #
          # Two independent derivations agree: composed transform (+20.421, +30.426,
          # -0.874) vs direct GNSS-minus-configured (+20.471, +30.123, -0.873). The
          # composed yaw is +0.0335 deg, i.e. a pure translation.
          map_offset_xyz: [20.421, 30.426, -0.874]

model:
  cfg_file: tools/cfgs/kitti_models/pointpillar_car.yaml
  # Authoritative AV-24 box dims live in this cfg's anchor_sizes: 4.876 x 1.930 x 1.55.
  checkpoint: ${LIDAR_OPENPCDET}/output/kitti_models/pointpillar_car/multitrack_run1/ckpt/checkpoint_epoch_30.pth
  pretrained_model: ""

pipeline:
  # Stages: all, check, probe, data, train, eval, visualize, export.
  # 'check' classifies each run's lidar rig against the av24 URDF; 'probe' measures GT
  # boxes against real lidar points. Both are read-only and belong before a decode.
  #
  # Set to 'train' 2026-08-14: the probe gates have been reviewed, Laguna is unblocked,
  # and the partial rebuilds (6537506, 6538079) passed pp_box_alignment on all 9 runs.
  stages: train

probe:
  # Which runs pp_probe_boxes.py reports on, and how much of each it decodes. 200 frames
  # at 10 Hz is a 20 s window centred on the closest approach -- enough to see the pass.
  runs: all
  max_frames: 200
  window_seconds: 60.0

dataset:
  clean: true
  max_frames: 0
  stride: 1
  # Minimum lidar points inside a GT box for it to be written as a label.
  #
  # Set explicitly because the fallback is 1: the value is normally read from
  # filter_by_min_points under the gt_sampling augmentor, and this dataset does not use
  # gt_sampling, so there is no entry to read. At 1, a box holding a single stray return
  # became a positive label -- teaching the model that one point means "car", which is a
  # direct route to the false positives the 27%-precision eval showed.
  #
  # 5 matches the OpenPCDet KITTI default. Measured cost on the probe windows: labels
  # retained at >=10 points range from 71% (LVMS unimore, median 11 points at ~39 m) to
  # 100% (IMS, LVMS 01_08); 5 is well inside that, and dropped frames become negatives,
  # which helps precision again.
  min_points_in_opponent_box: 5

  # Decode gating. Odometry is loaded before any cloud is read, so we already know when an
  # opponent was close enough to matter; everything else is decoded and thrown away.
  # Measured over the six enabled runs, only 51% of run time has any opponent within
  # 110 m, and on LVMS 2025_01_08 only 29% -- so roughly half the decode was waste.
  #
  # The gate must clear the grid's DIAGONAL, not its x extent, since a box can sit in a
  # corner. RAISED 2026-08-14 alongside POINT_CLOUD_RANGE x -> +-149.76:
  #   sqrt(149.76^2 + 53.12^2) = 158.9 m -> 170 m clears it with margin.
  # (was 120.0 for the old +-99.84 grid, whose diagonal was 113.1 m)
  #
  # Beyond the grid a box is dropped by mask_points_and_boxes_outside_range anyway, so
  # gating below the diagonal silently loses labels while gating above it only costs
  # decode time. Set to 0 to disable and decode everything.
  #
  # NOTE this only takes effect for runs that are actually rebuilt. After the 2026-08-14
  # partial rebuild, the four rebuilt runs carry frames out to 170 m while the other five
  # still stop at 120 m, so long-range training data is skewed toward Putnam + IMS until
  # the next full rebuild.
  opponent_range_gate_m: 170.0
  # Far stretches are still sampled, not skipped: they are where the empty frames that
  # empty_train_fraction feeds on come from, and negatives are the defence against false
  # positives. 2 s every 30 s is far more than the 0.20 ratio can consume.
  far_sample_seconds: 2.0
  far_sample_period_seconds: 30.0
  empty_train_fraction: 0.20
  empty_val_fraction: 0.20
  chunk_seconds: 20.0
  guard_seconds: 1.0
  train_fraction: 0.85
  test_fraction: 0.05

cache:
  enabled: true

train:
  batch_size: 4
  # 30, not Jay's 80. He trained 80 epochs on ~15k frames; this dataset has 62k, so 30
  # epochs already gives ~1.5x his total sample exposure. 80 here would be ~30 h of GPU
  # for little gain and more overfitting risk on the over-represented tracks (Putnam and
  # LVMS are ~38% of labels each, IMS only 10%).
  epochs: 30
  workers: 6

evaluate:
  batch_size: 4
  score_thresh: 0.1

visualize:
  run_index: 0
  start_seconds: null
  duration_seconds: 100.0
  stride: 1
  out: ${LIDAR_OPENPCDET}/logs/multitrack_r150_run2/visualize.mcap
  pred_topic: /kitti/pred_boxes

export:
  onnx_out_dir: ${LIDAR_OPENPCDET}/export_out
  params_h: ${LIDAR_OPENPCDET}/export_out/params.h

slurm:
  partition: gpu
  setup_gres: gpu:1
  # A40 (48 GB, sm_86), NOT quadro_rtx_6000 (24 GB). MEASURED 2026-08-14: at
  # POINT_CLOUD_RANGE +-149.76 the RTX 6000 OOMs at batch 4 (peak 20.5 GB of 23.46
  # usable); the A40 runs it at 2.16 h/epoch vs 2.74 h forced down to batch 2 on the
  # RTX 6000, and keeps batch_size 4 so LR 0.003 stays as tuned. batch 8 OOMs even on
  # 48 GB. The H100 nodes are faster still but this CUDA 11.3 container only compiles to
  # sm_86 and cannot target sm_90 without a rebuilt image.
  pipeline_gres: gpu:nvidia_a40:1
  setup_cpus: 4
  pipeline_cpus: 6
  setup_mem: 32G
  pipeline_mem: 64G
  setup_time: "01:00:00"
  pipeline_time: "4-00:00:00"
